<!DOCTYPE html>
<html lang="en">

<head>





    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stock Prices, Predictions and Changes</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">

    
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Predicting stocks for every company.</title>


    <meta name="theme-color"
          content="#ffffff"
          media="(prefers-color-scheme: light)">

    <meta name="theme-color"
          content="#222530"
          media="(prefers-color-scheme: dark)">



    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }




        .top-nav {
            width: 100%;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
            box-sizing: border-box;

            background: black;
            border-bottom: 1px solid #dddddd;
        }

        /* Stock Prices, Predictions and Changes name */

        .site-name {
            font-size: 32px;
            font-weight: bold;
            font-family: "PixelGrid", monospace;

            text-decoration: none;
            color: #ff57d6;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;

            list-style: none;

            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;

            color: #7f57ff;
            font-size: 16px;
        }



        .nav-links a:hover {
            color: #00ffe4;
        }


        .home-search {
            position: relative;

            max-width: 700px;

            margin: 80px auto 30px auto;
        }

        .home-search .search-icon {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 24px;
            color: #666666;
        }

        .home-search input {
            width: 100%;

            padding: 16px 16px 16px 52px;

            font-size: 20px;

            border: 1px solid #cccccc;
            border-radius: 8px;

            box-sizing: border-box;

            outline: none;
        }



        .home-search input:focus {
            border-color: #555555;
        }


        .search-results {
            position: absolute;

            top: 100%;
            left: 0;
            right: 0;

            background: black;

            border: 1px solid #dddddd;
            border-radius: 8px;

            margin-top: 5px;

            list-style: none;

            padding: 0;

            z-index: 1000;
        }


        .search-results li {
            padding: 12px 16px;

            cursor: pointer;

            text-align: left;
        }


        .search-results li:hover {
            background: #f2f2f2;
        }


        .suggestions {
            max-width: 700px;

            margin: 10px auto;

            text-align: center;
        }

        .suggestions a {
            display: inline-block;

            font-weight: 400;

            text-decoration: none;

            background: transparent;

            font-size: 16px;

            color: #555555;

            padding: 8px 12px;

            margin: 6px;

            border-radius: 6px;
        }


        .suggestions a:hover {
            background: #eeeeee;
        }



        footer {
            margin-top: 0;

            text-align: center;

            padding: 30px;
        }

    </style>

</head>

<body>

    <nav class="top-nav">



        <a href="index.html"
           class="site-name">

            Stock Prices, Predictions and Changes

        </a>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>


            <li>
                <a href="predictions.html">
                    Predictions
                </a>
            </li>


            <li>
                <a href="companies.html">
                    Companies
                </a>
            </li>


            <li>
                <a href="about.html">
                    About
                </a>
            </li>

        </ul>

    </nav>

    <main>

        <div class="home-search">

            <span class="search-icon">
                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16" y1="16" x2="21" y2="21"></line>
                </svg>
            </span>

            <input
                aria-label="Search for a company"
                type="search"
                id="company-search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search for a company"
            >



            <ul
                class="search-results"
                id="search-results">
            </ul>


        </div>


        <div class="suggestions">

            <span>Try:</span>

            <a href="cocacola.html">Coca-Cola</a>

            <a href="#">Apple</a>

            <a href="#">Microsoft</a>

        </div>

    </main>

<script>

    const searchBox = document.getElementById("company-search");

    searchBox.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            let search = searchBox.value.toLowerCase().trim();

            search = search.replace(/[\s-]/g, "");

            if (
                search === "cocacola" ||
                search === "cola" ||
                search === "coke"
            ) {
                window.location.href = "cocacola.html";
            }
        }
    });
</script>

</body>

</html>
